name: Deploy to Vercel

on:
  # Test-Deployment erst nachdem der CI-Workflow auf main erfolgreich war
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
  # Neues Release → Prod-Umgebung (Vercel Production, Schema: prod)
  release:
    types: [published]

jobs:
  # ── Test-Deployment – nur wenn CI grün war ───────────────────
  deploy-test:
    name: Deploy Test-Umgebung (Schema test)
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy → Vercel Preview (test)
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_PROD }}
          working-directory: ./
          # Kein --prod → landet als Preview-URL, Schema kommt aus Vercel Dashboard (Preview=test)
          vercel-args: ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deployment Summary
        run: |
          echo "✅ Test-Deployment abgeschlossen"
          echo "Schema:  test"
          echo "Commit:  ${{ github.event.workflow_run.head_sha }}"
          echo "Branch:  main"

  # ── Validierung vor Prod-Deployment ─────────────────────────
  validate-prod:
    name: Validierung vor Prod-Deployment
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Release-Tag auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: TypeScript-Prüfung
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit-Tests
        run: npm run test
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  # ── Prod-Deployment bei neuem Release ───────────────────────
  deploy-prod:
    name: Deploy Prod-Umgebung (Schema prod)
    if: github.event_name == 'release'
    needs: validate-prod
    runs-on: ubuntu-latest
    steps:
      - name: Release-Tag auschecken
        uses: actions/checkout@v4
        with:
          # Genau den Stand des Releases deployen, nicht HEAD
          ref: ${{ github.event.release.tag_name }}

      - name: Deploy → Vercel Production (prod)
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_PROD }}
          working-directory: ./
          # --prod: aktiviert die Vercel Production URL, Schema kommt aus Vercel Dashboard (Production=prod)
          vercel-args: '--prod'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deployment Summary
        run: |
          echo "✅ Prod-Deployment abgeschlossen"
          echo "Schema:  prod"
          echo "Release: ${{ github.event.release.tag_name }}"